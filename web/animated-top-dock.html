<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Top Dock — Sable</title>
  <style>
    @font-face {
      font-family: "ThreeUI Fragment Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("./fonts/fragment-mono.woff2") format("woff2");
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: visible;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .animated-top-dock-component {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      isolation: isolate;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .animated-top-dock__nav {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-start;
      gap: 3px;
      height: 38px;
      padding: 4px;
      overflow: visible;
      border: 1px solid #292929;
      border-radius: 11px;
      background: rgba(14, 14, 14, 0.86);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.48), inset 0 1px rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(18px) saturate(75%);
      -webkit-backdrop-filter: blur(18px) saturate(75%);
      isolation: isolate;
    }

    .animated-top-dock__item {
      position: relative;
      z-index: 6;
      display: inline-flex;
      flex: none;
      align-items: center;
      justify-content: center;
      height: 28px;
      min-width: 0;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 7px;
      outline: none;
      color: #858580;
      background: rgba(21, 21, 20, 0.9);
      font: 400 10px/1 "ThreeUI Fragment Mono", ui-monospace, monospace;
      letter-spacing: 0.1em;
      white-space: nowrap;
      backdrop-filter: blur(14px) saturate(70%);
      -webkit-backdrop-filter: blur(14px) saturate(70%);
      transform-origin: 50% 0;
      transition: color 0.15s, border-color 0.18s, background 0.18s, box-shadow 0.18s;
      will-change: width, height, transform;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .animated-top-dock__item[data-dock-near="true"],
    .animated-top-dock__item:focus-visible {
      z-index: 7;
      color: #ecece8;
      border-color: #41413e;
      background: rgba(27, 27, 26, 0.94);
      box-shadow: 0 7px 16px rgba(0, 0, 0, 0.26);
    }

    .animated-top-dock__logo {
      width: 28px;
      height: 28px;
      overflow: hidden;
      background: #e8e8e3;
    }

    .animated-top-dock__logo svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .animated-top-dock__link {
      gap: 6px;
      width: 94px;
      padding: 0 9px;
    }

    .animated-top-dock__link[aria-pressed="true"] {
      color: #111;
      border-color: #e8e8e3;
      background: #e8e8e3;
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.28);
    }

    .animated-top-dock__icon {
      display: inline-flex;
      flex: none;
      align-items: center;
      justify-content: center;
      width: 13px;
      height: 13px;
      opacity: 0.62;
      transition: opacity 0.16s;
    }

    .animated-top-dock__icon svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .animated-top-dock__item[data-dock-near="true"] .animated-top-dock__icon,
    .animated-top-dock__item:focus-visible .animated-top-dock__icon {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .animated-top-dock__nav {
        gap: 2px;
        height: 36px;
      }

      .animated-top-dock__item {
        height: 26px !important;
        transform: none !important;
      }

      .animated-top-dock__logo {
        width: 26px !important;
        height: 26px !important;
      }

      .animated-top-dock__link {
        width: auto !important;
        padding: 0 7px;
        font-size: 8px;
        letter-spacing: 0.07em;
      }

      .animated-top-dock__icon {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .animated-top-dock__item {
        transform: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="animated-top-dock-component">
    <nav class="animated-top-dock__nav" aria-label="Animated top dock" data-dock-state="idle" data-dock-max="0.00">
      <!-- Author brand logo -->
      <button class="animated-top-dock__item animated-top-dock__logo" data-dock-item type="button" aria-label="Home" data-id="home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="4.5" fill="#E8E8E3" />
          <path d="M6 6h8.6L18 9.35v8.15H9.15L6 14.35V6Z" fill="#111" />
          <path d="M9 9h5.15L15 9.85V15H9.85L9 14.15V9Z" fill="#E8E8E3" />
          <path d="M12 9v6M9 12h6" stroke="#111" stroke-width=".7" />
        </svg>
      </button>

      <!-- SYSTEM -->
      <button class="animated-top-dock__item animated-top-dock__link" data-dock-item type="button" aria-pressed="true" data-id="system">
        <span class="animated-top-dock__icon" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <rect x="2.25" y="2.25" width="4.5" height="4.5" rx=".8" />
            <rect x="9.25" y="2.25" width="4.5" height="4.5" rx=".8" />
            <rect x="2.25" y="9.25" width="4.5" height="4.5" rx=".8" />
            <rect x="9.25" y="9.25" width="4.5" height="4.5" rx=".8" />
          </svg>
        </span>
        <span>SYSTEM</span>
      </button>

      <!-- METHOD -->
      <button class="animated-top-dock__item animated-top-dock__link" data-dock-item type="button" aria-pressed="false" data-id="method">
        <span class="animated-top-dock__icon" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <circle cx="3" cy="8" r="1.5" />
            <circle cx="12.5" cy="3.5" r="1.5" />
            <circle cx="12.5" cy="12.5" r="1.5" />
            <path d="M4.5 7.3 11 4.2M4.5 8.7l6.5 3.1" />
          </svg>
        </span>
        <span>METHOD</span>
      </button>

      <!-- WORK -->
      <button class="animated-top-dock__item animated-top-dock__link" data-dock-item type="button" aria-pressed="false" data-id="work">
        <span class="animated-top-dock__icon" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <rect x="2" y="3" width="12" height="10" rx="1.5" />
            <path d="M2 6h12M5 4.5h.01M7 4.5h.01" />
          </svg>
        </span>
        <span>WORK</span>
      </button>

      <!-- ACCESS -->
      <button class="animated-top-dock__item animated-top-dock__link" data-dock-item type="button" aria-pressed="false" data-id="access">
        <span class="animated-top-dock__icon" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <circle cx="5.2" cy="6.2" r="2.7" />
            <path d="m7.2 8.2 5.9 5.1M10.2 10.8l1.5-1.5M12 12.4l1.4-1.4" />
          </svg>
        </span>
        <span>ACCESS</span>
      </button>

      <!-- NOTES -->
      <button class="animated-top-dock__item animated-top-dock__link" data-dock-item type="button" aria-pressed="false" data-id="notes">
        <span class="animated-top-dock__icon" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <path d="M4 2.25h5.4L12 4.85v8.9H4z" />
            <path d="M9.25 2.25V5h2.7M6 8h4M6 10.5h4" />
          </svg>
        </span>
        <span>NOTES</span>
      </button>
    </nav>
  </div>

  <script>
    (function() {
      const options = {
        proximity: 122,
        spring: 0.19,
        damping: 0.70,
        widthGrowth: 17,
        heightGrowth: 16,
        drop: 3.5,
        axis: "x",
        distribute: false,
        lockTrack: false,
      };

      const root = document.querySelector(".animated-top-dock__nav");
      if (!root) return;

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const reducedQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      const precisionQuery = window.matchMedia("(hover:hover) and (pointer:fine)");

      const itemElements = Array.from(root.querySelectorAll("[data-dock-item]"));
      const items = itemElements.map((element) => ({
        element,
        baseWidth: 0,
        baseHeight: 0,
        value: 0,
        velocity: 0,
        target: 0,
      }));

      let enabled = false;
      let pointerActive = false;
      let dirty = false;
      let frame = 0;

      const canAnimate = () => !reducedQuery.matches && root.clientWidth > 0 && window.innerWidth > 600 && precisionQuery.matches;

      const measure = () => {
        enabled = canAnimate();
        if (options.lockTrack) root.style.width = "";
        for (const state of items) {
          state.element.style.width = "";
          state.element.style.height = "";
          state.element.style.transform = "";
          state.element.dataset.dockNear = "false";
        }
        for (const state of items) {
          const rect = state.element.getBoundingClientRect();
          state.baseWidth = rect.width;
          state.baseHeight = rect.height;
          state.value = 0;
          state.velocity = 0;
          state.target = 0;
        }
        pointerActive = false;
        dirty = false;
        if (options.lockTrack) root.style.width = `${root.getBoundingClientRect().width.toFixed(2)}px`;
        root.dataset.dockState = enabled ? "idle" : "static";
        root.dataset.dockMax = "0.00";
      };

      const setTargets = (clientX, clientY) => {
        if (!enabled) return;
        const pointer = clientX;
        const rects = items.map((state) => state.element.getBoundingClientRect());
        for (let index = 0; index < items.length; index += 1) {
          const rect = rects[index];
          const center = rect.left + rect.width * 0.5;
          const proximity = clamp(1 - Math.abs(pointer - center) / Math.max(1, options.proximity), 0, 1);
          const influence = proximity * proximity * (3 - 2 * proximity);
          items[index].target = influence;
          items[index].element.dataset.dockNear = influence > 0.08 ? "true" : "false";
        }
        pointerActive = true;
        dirty = true;
        root.dataset.dockState = "active";
      };

      const focusItem = (item) => {
        if (!enabled) return;
        const index = items.findIndex((state) => state.element === item);
        if (index < 0) return;
        items.forEach((state, itemIndex) => {
          state.target = itemIndex === index ? 1 : Math.abs(itemIndex - index) === 1 ? 0.24 : 0;
          state.element.dataset.dockNear = state.target > 0.08 ? "true" : "false";
        });
        pointerActive = false;
        dirty = true;
        root.dataset.dockState = "focus";
      };

      const reset = () => {
        pointerActive = false;
        dirty = true;
        items.forEach((state) => {
          state.target = 0;
          state.element.dataset.dockNear = "false";
        });
      };

      const applyLayout = () => {
        for (const state of items) {
          const value = clamp(state.value, 0, 1.08);
          const isLogo = state.element.classList.contains("animated-top-dock__logo");
          const extraWidth = isLogo ? options.widthGrowth * (14 / 17) : Math.min(options.widthGrowth, state.baseWidth * 0.24);
          const extraHeight = isLogo ? options.heightGrowth * (14 / 16) : options.heightGrowth;
          state.element.style.width = `${(state.baseWidth + extraWidth * value).toFixed(2)}px`;
          state.element.style.height = `${(state.baseHeight + extraHeight * value).toFixed(2)}px`;
          state.element.style.transform = `translateY(${(value * options.drop).toFixed(2)}px)`;
        }
      };

      const draw = () => {
        if (enabled && dirty) {
          let moving = false;
          let maxValue = 0;
          for (const state of items) {
            state.velocity += (state.target - state.value) * options.spring;
            state.velocity *= options.damping;
            state.value += state.velocity;
            if (Math.abs(state.target - state.value) < 0.001 && Math.abs(state.velocity) < 0.001) {
              state.value = state.target;
              state.velocity = 0;
            } else {
              moving = true;
            }
            maxValue = Math.max(maxValue, clamp(state.value, 0, 1.08));
          }
          applyLayout();
          root.dataset.dockMax = maxValue.toFixed(2);
          if (!moving) {
            dirty = false;
            if (items.every((state) => state.target === 0)) root.dataset.dockState = "idle";
          }
        }
        frame = requestAnimationFrame(draw);
      };

      const onPointerMove = (event) => setTargets(event.clientX, event.clientY);
      const onWindowPointerMove = (event) => {
        if (!pointerActive) return;
        const rootRect = root.getBoundingClientRect();
        const itemRects = items.map((state) => state.element.getBoundingClientRect());
        const bottom = Math.max(rootRect.bottom, ...itemRects.map((rect) => rect.bottom));
        const outside = event.clientX < rootRect.left || event.clientX > rootRect.right || event.clientY < rootRect.top || event.clientY > bottom;
        if (outside) reset();
      };
      const onFocusIn = (event) => {
        const item = event.target?.closest?.("[data-dock-item]");
        if (item) focusItem(item);
      };
      const onFocusOut = (event) => {
        const next = event.relatedTarget;
        if (!next || !root.contains(next)) reset();
      };
      const onResize = () => measure();

      root.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointermove", onWindowPointerMove);
      root.addEventListener("focusin", onFocusIn);
      root.addEventListener("focusout", onFocusOut);
      root.addEventListener("pointerleave", reset);
      window.addEventListener("resize", onResize);

      measure();
      frame = requestAnimationFrame(draw);

      // Handle item selection and postMessage to parent Flutter container
      itemElements.forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-id") || "";
          itemElements.forEach((other) => {
            if (other.classList.contains("animated-top-dock__link")) {
              other.setAttribute("aria-pressed", other === btn ? "true" : "false");
            }
          });
          try {
            window.parent.postMessage({ type: "dock_navigate", id: id }, "*");
          } catch (e) {}
        });
      });
    })();
  </script>
</body>
</html>
