  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.playEmergencySiren = function() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const osc = ctx.createOscillator();
        const subOsc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sawtooth';
        subOsc.type = 'sine';
        
        const now = ctx.currentTime;
        gain.gain.setValueAtTime(0.35, now);
        
        // Two-tone Indian / European emergency siren waveform (750 Hz to 1200 Hz sweep)
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.linearRampToValueAtTime(1200, now + 0.35);
        osc.frequency.linearRampToValueAtTime(750, now + 0.7);
        osc.frequency.linearRampToValueAtTime(1200, now + 1.05);
        osc.frequency.linearRampToValueAtTime(750, now + 1.4);
        
        subOsc.frequency.setValueAtTime(375, now);
        subOsc.frequency.linearRampToValueAtTime(600, now + 0.35);
        subOsc.frequency.linearRampToValueAtTime(375, now + 0.7);
        subOsc.frequency.linearRampToValueAtTime(600, now + 1.05);
        subOsc.frequency.linearRampToValueAtTime(375, now + 1.4);

        gain.gain.setValueAtTime(0.35, now + 1.25);
        gain.gain.linearRampToValueAtTime(0.001, now + 1.6);
        
        osc.connect(gain);
        subOsc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start(now);
        subOsc.start(now);
        osc.stop(now + 1.6);
        subOsc.stop(now + 1.6);
        console.log("🚨 Emergency siren audio waveform triggered successfully.");
      } catch (e) {
        console.warn('Emergency siren audio context error:', e);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
