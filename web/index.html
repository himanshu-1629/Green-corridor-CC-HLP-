<!DOCTYPE html>
<html>
<head>
  <!-- Non-blocking asynchronous Google Maps Script with error fallback -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBoUfYgAJxQsyKqf8TrCm50s5pqFLZtjBQ"></script>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Green Corridor — Precision Emergency Medical Logistics and Transit Coordination Platform">
  <meta name="theme-color" content="#FFFFFF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Green Corridor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Green Corridor — Emergency Medical Logistics</title>
  <link rel="manifest" href="manifest.json">

  <!-- Neue Montreal Brand Font System -->
  <link rel="stylesheet" href="fonts/NeueMontreal.css">
  <style>
    @font-face {
      font-family: 'Neue Montreal';
      src: url('fonts/NeueMontreal-Regular.woff2') format('woff2'),
           url('fonts/NeueMontreal-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Montreal';
      src: url('fonts/NeueMontreal-Medium.woff2') format('woff2'),
           url('fonts/NeueMontreal-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Neue Montreal';
      src: url('fonts/NeueMontreal-Bold.woff2') format('woff2'),
           url('fonts/NeueMontreal-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'NeueMontreal';
      src: url('fonts/NeueMontreal-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'NeueMontreal';
      src: url('fonts/NeueMontreal-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'NeueMontreal';
      src: url('fonts/NeueMontreal-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    /* Clean White base canvas #FFFFFF */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      font-family: 'NeueMontreal', 'Neue Montreal', -apple-system, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Green Corridor Custom 3D Dimensional Loading Orb Pre-Loader */
    #gc-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #FFFFFF 0%, #FAFAFA 50%, #F5F5F5 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }

    .gc-orb-stage {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    /* Ambient Warm Radiant Halo */
    .gc-orb-glow {
      position: absolute;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 109, 41, 0.22) 0%, rgba(69, 48, 39, 0.08) 45%, transparent 70%);
      pointer-events: none;
    }

    /* Grounding Contact Shadow */
    .gc-orb-shadow {
      position: absolute;
      bottom: 2px;
      width: 68px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 50%, rgba(22, 19, 22, 0.16) 0%, transparent 75%);
    }

    /* 3D Dimensional Spherical Core */
    .gc-orb-sphere {
      position: relative;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 32%, #FFFFFF 0%, #EBEBEB 28%, #453027 72%, #161316 100%);
      box-shadow:
        0 8px 24px rgba(22, 19, 22, 0.14),
        inset -3px -3px 8px rgba(22, 19, 22, 0.6),
        inset 3px 3px 8px rgba(255, 255, 255, 0.85);
      overflow: hidden;
    }

    /* Rotating 3D Internal Transit Grid Rings (Brand Orange #FF6D29) */
    .gc-orb-ring-1 {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 66px;
      height: 66px;
      margin: -33px 0 0 -33px;
      border-radius: 50%;
      border: 1.4px solid rgba(255, 109, 41, 0.35);
      border-top-color: #FF6D29;
      transform: rotateX(68deg) rotateY(20deg);
      animation: gc-orb-rot-1 3.4s linear infinite;
    }

    .gc-orb-ring-2 {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px;
      height: 60px;
      margin: -30px 0 0 -30px;
      border-radius: 50%;
      border: 1.4px solid rgba(255, 109, 41, 0.40);
      border-bottom-color: #FF6D29;
      transform: rotateX(-58deg) rotateY(32deg);
      animation: gc-orb-rot-2 4.6s linear infinite reverse;
    }

    /* Surface Specular Gloss Crescent */
    .gc-orb-gloss {
      position: absolute;
      top: 6px;
      left: 10px;
      width: 32px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.82) 0%, rgba(255, 255, 255, 0) 80%);
      transform: rotate(-30deg);
      pointer-events: none;
    }

    .gc-brand-title {
      font-family: 'NeueMontreal', 'Neue Montreal', sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 1.4px;
      color: #161316;
      text-transform: uppercase;
    }

    .gc-brand-sub {
      margin-top: 6px;
      font-size: 12.5px;
      font-weight: 400;
      letter-spacing: 0.2px;
      color: #5A525A;
    }

    .gc-pulse-badge {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      background: #FFFFFF;
      border: 1.1px solid #BABABA;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 500;
      color: #453027;
      letter-spacing: 0.6px;
      box-shadow: 0 2px 8px rgba(22, 19, 22, 0.05);
    }

    .gc-pulse-dot {
      width: 7px;
      height: 7px;
      background: #FF6D29;
      border-radius: 50%;
      animation: gc-pulse 1.6s ease-in-out infinite;
      box-shadow: 0 0 6px rgba(255, 109, 41, 0.6);
    }

    @keyframes gc-orb-rot-1 {
      0% { transform: rotateX(68deg) rotateY(20deg) rotateZ(0deg); }
      100% { transform: rotateX(68deg) rotateY(20deg) rotateZ(360deg); }
    }

    @keyframes gc-orb-rot-2 {
      0% { transform: rotateX(-58deg) rotateY(32deg) rotateZ(0deg); }
      100% { transform: rotateX(-58deg) rotateY(32deg) rotateZ(360deg); }
    }

    @keyframes gc-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>
<body>
  <!-- Brand Pre-Loader: Custom Animated Medical Loading Orb -->
  <div id="gc-preloader">
    <div class="gc-orb-stage">
      <div class="gc-orb-glow"></div>
      <div class="gc-orb-shadow"></div>
      <div class="gc-orb-sphere">
        <div class="gc-orb-ring-1"></div>
        <div class="gc-orb-ring-2"></div>
        <div class="gc-orb-gloss"></div>
      </div>
    </div>
    <div class="gc-brand-title">GREEN CORRIDOR</div>
    <div class="gc-brand-sub">Emergency Medical Logistics Platform</div>
    <div class="gc-pulse-badge">
      <span class="gc-pulse-dot"></span>
      SYNCHRONIZING TRANSIT ARTERIES
    </div>
  </div>

  <script>
    // Audio synthesizer for siren simulation
    window.playEmergencySiren = function() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const osc = ctx.createOscillator();
        const subOsc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sawtooth';
        subOsc.type = 'sine';
        
        const now = ctx.currentTime;
        gain.gain.setValueAtTime(0.35, now);
        
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.linearRampToValueAtTime(1200, now + 0.35);
        osc.frequency.linearRampToValueAtTime(750, now + 0.7);
        osc.frequency.linearRampToValueAtTime(1200, now + 1.05);
        osc.frequency.linearRampToValueAtTime(750, now + 1.4);
        
        subOsc.frequency.setValueAtTime(375, now);
        subOsc.frequency.linearRampToValueAtTime(600, now + 0.35);
        subOsc.frequency.linearRampToValueAtTime(375, now + 0.7);
        subOsc.frequency.linearRampToValueAtTime(600, now + 1.05);
        subOsc.frequency.linearRampToValueAtTime(375, now + 1.4);

        gain.gain.setValueAtTime(0.35, now + 1.25);
        gain.gain.linearRampToValueAtTime(0.001, now + 1.6);
        
        osc.connect(gain);
        subOsc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start(now);
        subOsc.start(now);
        osc.stop(now + 1.6);
        subOsc.stop(now + 1.6);
      } catch (e) {
        console.warn('Emergency siren audio context notice:', e);
      }
    };

    // Ensure wheel/touch events forwarded from 3D canvas iframes smoothly scroll the window
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'GC_FORWARD_WHEEL') {
        window.scrollBy({ top: e.data.deltaY, behavior: 'auto' });
      }
    });

    // Remove pre-loader when Flutter first mounts
    window.addEventListener('flutter-first-frame', function() {
      const preloader = document.getElementById('gc-preloader');
      if (preloader) {
        preloader.style.opacity = '0';
        setTimeout(() => preloader.remove(), 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
